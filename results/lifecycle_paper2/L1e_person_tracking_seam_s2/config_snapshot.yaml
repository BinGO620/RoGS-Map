# L1e 缝隙带救援（D2-008）：person_tracking / seam 臂（主臂，三信号四合取 carve）
# 预注册 = results/lifecycle_paper2/evidence/prereg_L1e_seam.md（判据先锁；先于任何 run 提交）
# 依据 = offline_diagnosis_2026-09-23.md：pt 鬼影卡三堵墙（几何缝隙带 5-10cm / α 钉 0.2199 / exit 无 fill）
# 机制 = sem_vacated(最近 8 KF 掩码并集 ∧ 现非掩码) ∧ 带内(深度差 ∈ [0.05, 0.10)) ∧ α<0.25
#        ∧ obs≥3 → prune + exit_fill 管线补洞（balloon2 已验证全链）；default-off 新键 seam_carve
# 带语义 = [seam_delta_m, seam_hi_m)：下限 0.05（与 reset 域重叠无害，删除是更强动作）、
#        上限 0.10 = delta_free（更深的归原 carve 管，seam 只修缝隙不重复管辖）
# 对照 = 已有 L3 exit 同 seed canonical（零新增对照 run）
inherit_from: "configs/rgbd/bonn/person_tracking.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

AlphaLifecycle:
  enabled: true
  mode: "exit_fill"
  seam_carve: true
  seam_warm_kfs: 8
  seam_delta_m: 0.05
  seam_hi_m: 0.10
  seam_tau: 0.25
  fill_k: 8
  fill_band_abs_m: 0.10
  fill_band_rel: 0.03
  fill_min_opacity: 0.5
  fill_max_points: 2000

Results:
  static_bg_mask_subdir: "dynamic_mask"
  save_dir: "results/lifecycle_paper2/L1e_person_tracking_seam"
  save_per_frame_ape: true
