# L1e 缝隙带救援（D2-008）：person_tracking / paramrescue 臂（消融对照，零新代码）
# 预注册 = results/lifecycle_paper2/evidence/prereg_L1e_seam.md（判据先锁）
# 作用 = 分辨"三信号必要" vs "参数本来就错"（D2-005 B 未测路径；R2 新证据 = 缝隙带
#         诊断推翻当时"α 钉死"否决依据）。与 l3_person_tracking_exit.yaml 仅差
#         mode(exit_fill) + tau_carve(0.20→0.25) + delta_free_m(0.10→0.05)
# 风险预锁 = crowd3 形态（无掩码约束的 carve 删真几何挖洞，Δfv +1.56）——误删护栏
#         static_coverage≥0.99 判 run 无效
inherit_from: "configs/rgbd/bonn/person_tracking.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

AlphaLifecycle:
  enabled: true
  mode: "exit_fill"
  tau_carve: 0.25
  delta_free_m: 0.05
  fill_k: 8
  fill_band_abs_m: 0.10
  fill_band_rel: 0.03
  fill_min_opacity: 0.5
  fill_max_points: 2000

Results:
  static_bg_mask_subdir: "dynamic_mask"
  save_dir: "results/lifecycle_paper2/L1e_person_tracking_paramrescue"
  save_per_frame_ape: true
