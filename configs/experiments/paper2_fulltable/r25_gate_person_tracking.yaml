# R25 gate diagnostic: provisional swba_min_rel_improve=0.2 — the log line
# carries per-KF |dc| (relative window-cost improvement) on BOTH regimes:
# crowd2 (harmful 3-7cm corrections) and person_tracking (helpful drift
# corrections). Distribution separation calibrates the final threshold;
# the ATE of this run simultaneously tests whether the gate removes the
# easy-sequence regression. Fulltable attribution: SWBA noise injection,
# loop exonerated (graph 0.00cm no-op on crowd2).

inherit_from: "configs/rgbd/bonn/person_tracking.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

SWBA:
  enabled: true
  swba_min_rel_improve: 0.2

LoopClosure:
  enabled: true
  min_gap: 25
  sim_thresh: 0.65
  max_loops_per_kf: 3
  loop_weight: 30.0
  app_candidates: 20
  geo_candidates: 60
  geo_score_v3: true
  geo_cell_diversity: true
  verify_block_affine: true
  affine_grid: 1
  max_median_resid: 0.05
  verify_icp_init: true

Results:
  save_dir: "results/paper2_fulltable/r25_gate_person_tracking"
  save_per_frame_ape: true
