# R33 rebaseline of the GATE arm (final + per-frame static_conf gate at 0.38).
# Byte-identical to r32_regate038_crowd2.yaml except save_dir. r32 is the same
# config dispatched in a separate batch; running it again inside R33 makes
# Tab.1's three arms (baseline/final/gate) one batch, and the r32-vs-r33 pair
# is a same-config replicate that measures the cross-batch offset.
# See evidence/prereg_rebase_arms.md.
inherit_from: "configs/rgbd/bonn/crowd2.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

SWBA:
  enabled: true
  swba_max_static_conf: 0.38

LoopClosure:
  enabled: true
  min_gap: 25
  sim_thresh: 0.65
  max_loops_per_kf: 3
  loop_weight: 30.0
  app_candidates: 20
  geo_candidates: 60
  geo_score_v3: true
  geo_cell_diversity: true
  verify_block_affine: true
  affine_grid: 1
  max_median_resid: 0.05
  verify_icp_init: true

Results:
  save_dir: "results/paper2_fulltable/r33_rebase_gate_crowd2"
  save_per_frame_ape: true
