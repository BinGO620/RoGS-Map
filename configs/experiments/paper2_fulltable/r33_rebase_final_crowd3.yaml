# R33 rebaseline of the FINAL arm (SWBA + loop closure).
# Byte-identical to crowd3_final.yaml except save_dir. The original arm ran
# 2026-09-06/07, before the SWBA jacobian fixes a21e0773 / 1150fb25
# (2026-09-09), so its ATE is not comparable to post-fix arms. See
# results/paper2_fulltable/evidence/prereg_rebase_arms.md.
inherit_from: "configs/rgbd/bonn/crowd3.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"

SWBA:
  enabled: true

LoopClosure:
  enabled: true
  min_gap: 25
  sim_thresh: 0.65
  max_loops_per_kf: 3
  loop_weight: 30.0
  app_candidates: 20
  geo_candidates: 60
  geo_score_v3: true
  geo_cell_diversity: true
  verify_block_affine: true
  affine_grid: 1
  max_median_resid: 0.05
  verify_icp_init: true

Results:
  save_dir: "results/paper2_fulltable/r33_rebase_final_crowd3"
  save_per_frame_ape: true
