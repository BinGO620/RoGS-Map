frames: [2, 93, 122, 141, 178, 197, 243, 282, 309, 329, 347, 398, 421, 439, 512, 561]
# P1/P2/C- 为父预注册同义臂（同批重测，构成又一次 L2 数据点）；P2c/P2cv/C-c 为因果臂
arms: [P1, P2, C-, P2c, P2cv, C-c]

maps:
