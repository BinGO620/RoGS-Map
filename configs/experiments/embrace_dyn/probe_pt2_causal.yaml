# embrace_dyn 三轮全 NO-GO 收口（NOTES 已排除方向），保留仅作审计痕迹，rerun 必断裂。
# embrace_dyn 因果化探针配置（预注册：evidence/prereg_dyn_probe_causal.md）
# 与父配置同参数（帧/拟合/插入），只增加因果臂与 map 级 KF 日志来源。
prereg: results/embrace_dyn/evidence/prereg_dyn_probe_causal.md
sequence: person_tracking2
device: cuda:0
ply: final_after_opt
mask_subdir: dynamic_mask_gtmc
mask_class: 15

unproj_stride: 3
fit_iters: 300
lrs:
  xyz: 5.0e-4
  scale: 5.0e-3
  rot: 1.0e-3
  opa: 5.0e-2
  dc: 5.0e-3

