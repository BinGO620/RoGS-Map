inherit_from: "configs/rgbd/tum/f3_st_hf.yaml"
method_from: "configs/experiments/combined_prune/method.yaml"
method: "Combined-Prune"
SWBA:
  enabled: true
  swba_max_static_conf: 0.38
LoopClosure:
  enabled: true
  min_gap: 25
  sim_thresh: 0.65
  max_loops_per_kf: 3
  loop_weight: 30.0
  app_candidates: 20
  geo_candidates: 60
  geo_score_v3: true
  geo_cell_diversity: true
  verify_block_affine: true
  affine_grid: 1
  max_median_resid: 0.05
  verify_icp_init: true
SemanticMask:
  enabled: true
  model: "maskrcnn"
  dynamic_classes: [1]
  dilate_px: 7
  mask_mapping: true
  mask_insertion: true
MaskStability:
  enabled: true
DiagMskFix:
  note: "掩码静止性判定+空洞回填 v1: gate 全开 + 世界系体素账本释放"
Results:
  save_per_frame_ape: true
